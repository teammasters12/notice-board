<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Student System</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    :root{
      --bg:#080808;
      --panel:#121212;
      --panel-2:#171717;
      --text:#f5f5f5;
      --muted:#a3a3a3;
      --border:#2a2a2a;
      --accent:#ef4444;
      --accent-hover:#dc2626;
      --danger:#b91c1c;
      --danger-hover:#991b1b;
      --ok:#16a34a;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:12px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background: radial-gradient(circle at top right, #1a0b0b 0%, var(--bg) 45%);
      color:var(--text);
      padding:24px;
    }

    .app{
      max-width:1200px;
      margin:0 auto;
    }

    h1{
      text-align:center;
      margin:0 0 22px;
      font-size:1.9rem;
      letter-spacing:.3px;
    }

    .subtitle{
      text-align:center;
      margin:-10px 0 26px;
      color:var(--muted);
      font-size:.95rem;
    }

    .card{
      background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }

    .card h3{
      margin:0 0 14px;
      font-size:1.1rem;
      color:#fff;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:.8rem;
      color:#d4d4d4;
    }

    input{
      width:100%;
      padding:10px 12px;
      background:#0f0f0f;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:10px;
      outline:none;
      transition:.2s ease;
    }

    input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(239,68,68,.2);
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:14px;
      flex-wrap:wrap;
    }

    .btn{
      border:none;
      border-radius:10px;
      padding:10px 14px;
      color:white;
      cursor:pointer;
      font-weight:600;
      transition:.2s ease;
    }

    .btn-primary{
      background:var(--accent);
    }
    .btn-primary:hover{ background:var(--accent-hover); }

    .btn-secondary{
      background:#262626;
      border:1px solid #3a3a3a;
    }
    .btn-secondary:hover{ background:#303030; }

    .btn-danger{
      background:var(--danger);
    }
    .btn-danger:hover{ background:var(--danger-hover); }

    .toolbar{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .toolbar input{
      flex:1;
      min-width:220px;
    }

    .table-wrap{
      overflow:auto;
      border-radius:10px;
      border:1px solid var(--border);
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:760px;
      background:#0f0f0f;
    }

    th, td{
      text-align:left;
      padding:11px 10px;
      border-bottom:1px solid #252525;
      font-size:.92rem;
    }

    th{
      background:#151515;
      color:#fca5a5;
      position:sticky;
      top:0;
      z-index:1;
    }

    tr:hover td{
      background:#161616;
    }

    .btn-sm{
      padding:6px 10px;
      font-size:.82rem;
      border-radius:8px;
    }

    .status{
      margin-top:10px;
      font-size:.9rem;
      color:var(--muted);
    }

    .empty{
      text-align:center;
      color:var(--muted);
      padding:18px;
      display:none;
    }

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#111;
      border:1px solid #2f2f2f;
      color:#fff;
      padding:10px 12px;
      border-radius:10px;
      box-shadow:var(--shadow);
      opacity:0;
      pointer-events:none;
      transform:translateY(10px);
      transition:.25s;
      max-width:320px;
      font-size:.9rem;
    }

    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    .toast.ok{ border-color:#166534; }
    .toast.err{ border-color:#7f1d1d; }

    @media (max-width:980px){
      .form-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    }

    @media (max-width:560px){
      body{ padding:14px; }
      .form-grid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Student Management</h1>
    <p class="subtitle">Red + Black UI • Clean, fast, and easier to use</p>

    <section class="card">
      <h3>Add Student</h3>

      <form id="studentForm" onsubmit="event.preventDefault(); addStudent();">
        <div class="form-grid">
          <div class="field"><label>First Name *</label><input id="first_name" required></div>
          <div class="field"><label>Last Name *</label><input id="last_name" required></div>
          <div class="field"><label>Gender</label><input id="gender"></div>
          <div class="field"><label>Date of Birth</label><input id="dob" type="date"></div>

          <div class="field"><label>Age</label><input id="age" type="number" min="1"></div>
          <div class="field"><label>Grade *</label><input id="grade" required></div>
          <div class="field"><label>Class</label><input id="class"></div>
          <div class="field"><label>Admission No</label><input id="admission"></div>

          <div class="field"><label>Phone</label><input id="phone"></div>
          <div class="field"><label>Email</label><input id="email" type="email"></div>
          <div class="field"><label>Address</label><input id="address"></div>
          <div class="field"><label>City</label><input id="city"></div>

          <div class="field"><label>Guardian Name</label><input id="guardian_name"></div>
          <div class="field"><label>Guardian Phone</label><input id="guardian_phone"></div>
          <div class="field"><label>Guardian Email</label><input id="guardian_email" type="email"></div>
          <div class="field"><label>Joining Date</label><input id="joining_date" type="date"></div>

          <div class="field"><label>House</label><input id="house"></div>
          <div class="field"><label>Status</label><input id="status" placeholder="Active / Inactive"></div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="addBtn" type="submit">Add Student</button>
          <button class="btn btn-secondary" type="button" onclick="clearForm()">Clear Form</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <input id="search" placeholder="Search by first or last name..." oninput="searchStudent()">
        <button class="btn btn-secondary" onclick="loadStudents()">Refresh</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Grade</th>
              <th>Class</th>
              <th>Phone</th>
              <th>City</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>

      <div id="emptyState" class="empty">No students found.</div>
      <div id="statusLine" class="status">Loading students...</div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const supabase = window.supabase.createClient(
      "https://jjxsjggnzvzyupjhnxev.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqeHNqZ2duenZ6eXVwamhueGV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwODcyMDIsImV4cCI6MjA4ODY2MzIwMn0.fyNmsSolIEksQpF8XxF5t7Urezwnpgb0vbTsWxqTdyI"
    );

    let searchTimer = null;

    function toast(message, isError = false){
      const t = document.getElementById("toast");
      t.textContent = message;
      t.className = "toast show " + (isError ? "err" : "ok");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setStatus(text){
      document.getElementById("statusLine").textContent = text;
    }

    async function loadStudents(searchText = ""){
      setStatus("Loading students...");

      let query = supabase
        .from("students")
        .select("*")
        .order("student_id", { ascending: false });

      if (searchText.trim()) {
        const term = searchText.trim();
        query = query.or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%`);
      }

      const { data, error } = await query;

      if (error) {
        setStatus("Error loading students");
        toast(error.message, true);
        showStudents([]);
        return;
      }

      showStudents(data || []);
      setStatus(`Total students: ${data.length}`);
    }

    function showStudents(data){
      const table = document.getElementById("studentTable");
      const empty = document.getElementById("emptyState");
      table.innerHTML = "";

      if (!data.length){
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      data.forEach(s => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(s.student_id)}</td>
          <td>${escapeHtml(s.first_name)} ${escapeHtml(s.last_name)}</td>
          <td>${escapeHtml(s.grade)}</td>
          <td>${escapeHtml(s.class)}</td>
          <td>${escapeHtml(s.phone)}</td>
          <td>${escapeHtml(s.city)}</td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="deleteStudent(${Number(s.student_id)})">Delete</button>
          </td>
        `;
        table.appendChild(tr);
      });
    }

    function clearForm(){
      document.getElementById("studentForm").reset();
      toast("Form cleared");
    }

    async function addStudent(){
      const addBtn = document.getElementById("addBtn");
      addBtn.disabled = true;
      addBtn.textContent = "Saving...";

      const payload = {
        first_name: document.getElementById("first_name").value.trim(),
        last_name: document.getElementById("last_name").value.trim(),
        gender: document.getElementById("gender").value.trim() || null,
        date_of_birth: document.getElementById("dob").value || null,
        age: document.getElementById("age").value ? Number(document.getElementById("age").value) : null,
        grade: document.getElementById("grade").value.trim(),
        class: document.getElementById("class").value.trim() || null,
        admission_number: document.getElementById("admission").value.trim() || null,
        phone: document.getElementById("phone").value.trim() || null,
        email: document.getElementById("email").value.trim() || null,
        address: document.getElementById("address").value.trim() || null,
        city: document.getElementById("city").value.trim() || null,
        guardian_name: document.getElementById("guardian_name").value.trim() || null,
        guardian_phone: document.getElementById("guardian_phone").value.trim() || null,
        guardian_email: document.getElementById("guardian_email").value.trim() || null,
        joining_date: document.getElementById("joining_date").value || null,
        house: document.getElementById("house").value.trim() || null,
        status: document.getElementById("status").value.trim() || null
      };

      if (!payload.first_name || !payload.last_name || !payload.grade){
        toast("First name, last name, and grade are required.", true);
        addBtn.disabled = false;
        addBtn.textContent = "Add Student";
        return;
      }

      const { error } = await supabase.from("students").insert([payload]);

      addBtn.disabled = false;
      addBtn.textContent = "Add Student";

      if (error){
        toast(error.message, true);
        return;
      }

      toast("Student added successfully");
      clearForm();
      loadStudents(document.getElementById("search").value);
    }

    async function deleteStudent(id){
      if (!confirm("Delete this student?")) return;

      const { error } = await supabase
        .from("students")
        .delete()
        .eq("student_id", id);

      if (error){
        toast(error.message, true);
        return;
      }

      toast("Student deleted");
      loadStudents(document.getElementById("search").value);
    }

    function searchStudent(){
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadStudents(document.getElementById("search").value);
      }, 250);
    }

    loadStudents();
  </script>
</body>
</html>
