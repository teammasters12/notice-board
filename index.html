<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 10 Students Database</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#060606; --panel:#101010; --panel2:#151515; --line:#2b2b2b;
      --txt:#f5f5f5; --muted:#a3a3a3; --red:#ef4444; --red2:#b91c1c;
      --glow:0 0 20px rgba(239,68,68,.25);
      --r:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#200a0a,transparent 40%),var(--bg);color:var(--txt)}
    .wrap{max-width:1250px;margin:auto;padding:16px}
    .top{
      position:sticky;top:0;z-index:50;backdrop-filter: blur(8px);
      background:rgba(10,10,10,.8);border:1px solid var(--line);border-radius:12px;
      display:flex;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:14px
    }
    .brand{display:flex;gap:10px;align-items:center}
    .logo{width:38px;height:38px;border-radius:10px;background:#1b1b1b;border:1px dashed #444;display:grid;place-items:center;color:#888}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid #3a3a3a;background:#1a1a1a;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}
    .btn:hover{box-shadow:var(--glow);border-color:#7f1d1d}
    .btn.red{background:linear-gradient(135deg,var(--red),var(--red2));border:none}
    .pill{padding:6px 10px;border-radius:999px;background:#1a1a1a;border:1px solid #343434;font-size:.85rem;color:#ddd}
    .hero,.panel{
      border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));
      border-radius:var(--r);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:12px
    }
    .hero h1{margin:0 0 8px}
    .hero .row{display:flex;gap:10px;flex-wrap:wrap}
    .hidden{display:none!important}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:6px}
    label{font-size:.82rem;color:#ddd}
    input,select,textarea{
      width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#0e0e0e;color:#fff;outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:var(--glow)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .student-card{
      border:1px solid #2d2d2d;background:#0d0d0d;border-radius:14px;padding:10px;cursor:pointer;transition:.2s
    }
    .student-card:hover{transform:translateY(-3px);border-color:#7f1d1d;box-shadow:var(--glow)}
    .photo{height:130px;border-radius:10px;border:1px solid #333;background:#151515;display:grid;place-items:center;overflow:hidden}
    .photo img{width:100%;height:100%;object-fit:cover}
    .student-card h4{margin:10px 0 4px;text-align:center}
    .student-card p{margin:0;text-align:center;color:#ddd}
    .student-card small{display:block;text-align:center;color:#aaa;margin-top:6px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .toolbar input{flex:1;min-width:250px}
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:99
    }
    .modal.show{display:flex}
    .modal-box{
      width:min(900px,100%);max-height:90vh;overflow:auto;background:#101010;border:1px solid #303030;border-radius:14px;padding:16px
    }
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .kv{padding:8px;border:1px solid #2a2a2a;border-radius:10px;background:#0c0c0c}
    footer{
      margin-top:18px;border:1px solid #2a2a2a;border-radius:12px;padding:14px;background:#0c0c0c;
      display:grid;grid-template-columns:1fr 1fr;gap:10px
    }
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-grid{grid-template-columns:1fr}}
    @media(max-width:620px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo">LOGO</div>
        <div>
          <strong>Grade 10 Students Database</strong><br>
          <small style="color:#aaa">Futuristic Red/Black Panel</small>
        </div>
      </div>
      <nav class="nav">
        <button class="btn" onclick="goHome()">Home</button>
        <button class="btn" onclick="openMode('add')">Add</button>
        <button class="btn" onclick="openMode('remove')">Remove</button>
        <button class="btn" onclick="openMode('explore')">Explore</button>
      </nav>
      <div class="nav">
        <span id="userRole" class="pill">Guest</span>
        <button class="btn" onclick="openAuth()">Login</button>
        <button class="btn hidden" id="logoutBtn" onclick="logout()">Logout</button>
      </div>
    </header>

    <section class="hero" id="hero">
      <h1>Grade 10 Students Database</h1>
      <p style="color:#bbb">Choose what you want to do:</p>
      <div class="row">
        <button class="btn red" onclick="openMode('add')">Add Details (Admin)</button>
        <button class="btn red" onclick="openMode('remove')">Remove Details (Admin)</button>
        <button class="btn" onclick="openMode('explore')">Explore Details</button>
      </div>
    </section>

    <section class="panel hidden" id="addPanel">
      <h3>Add Student Details</h3>
      <form id="addForm">
        <div class="grid">
          <div class="field"><label>First Name</label><input id="first_name" required></div>
          <div class="field"><label>Last Name</label><input id="last_name" required></div>
          <div class="field"><label>Gender</label><input id="gender"></div>
          <div class="field"><label>Date of Birth</label><input id="dob" type="date"></div>

          <div class="field"><label>Age</label><input id="age" type="number"></div>
          <div class="field"><label>Grade</label><input id="grade" required></div>
          <div class="field"><label>Class</label><input id="class_name" required></div>
          <div class="field"><label>Admission No</label><input id="admission_number"></div>

          <div class="field"><label>Phone</label><input id="phone"></div>
          <div class="field"><label>Email</label><input id="email" type="email"></div>
          <div class="field"><label>Status</label><input id="status" placeholder="Active / Inactive"></div>
          <div class="field">
            <label>Transportation Method</label>
            <select id="transport_method">
              <option value="">Select...</option>
              <option>public transport - bus (sltb)</option>
              <option>public transport - bus (private)</option>
              <option>public transport - train</option>
              <option>public transport - vans</option>
              <option>private transport</option>
              <option>other</option>
            </select>
          </div>

          <div class="field"><label>Address Line 1</label><input id="address_line1"></div>
          <div class="field"><label>Address Line 2</label><input id="address_line2"></div>
          <div class="field"><label>Address Line 3</label><input id="address_line3"></div>
          <div></div>

          <div class="field"><label>Father Name</label><input id="father_name"></div>
          <div class="field"><label>Father ID</label><input id="father_id"></div>
          <div class="field"><label>Father Phone</label><input id="father_phone"></div>
          <div class="field"><label>Father Profession/Designation</label><input id="father_profession"></div>
          <div class="field"><label>Father Official Address</label><input id="father_official_address"></div>
          <div class="field"><label>Father Office Phone Number</label><input id="father_office_phone"></div>

          <div class="field"><label>Mother Name</label><input id="mother_name"></div>
          <div class="field"><label>Mother ID</label><input id="mother_id"></div>
          <div class="field"><label>Mother Phone</label><input id="mother_phone"></div>
          <div class="field"><label>Mother Profession/Designation</label><input id="mother_profession"></div>
          <div class="field"><label>Mother Official Address</label><input id="mother_official_address"></div>
          <div class="field"><label>Mother Office Phone Number</label><input id="mother_office_phone"></div>

          <div class="field"><label>ID Photo</label><input id="id_photo" type="file" accept="image/*"></div>
          <div class="field"><label>Birth Certificate</label><input id="birth_certificate" type="file" accept=".pdf,image/*"></div>
        </div>
        <div style="margin-top:12px"><button class="btn red" type="submit">Add Student</button></div>
      </form>
    </section>

    <section class="panel hidden" id="removePanel">
      <h3>Remove Student</h3>
      <div class="toolbar">
        <input id="remove_id" placeholder="Enter Student ID">
        <button class="btn red" onclick="removeById()">Remove Student</button>
      </div>
    </section>

    <section class="panel hidden" id="explorePanel">
      <h3>Explore Students</h3>
      <div class="toolbar">
        <input id="search" placeholder="Search by Name / Phone / Class" oninput="loadCards()">
      </div>
      <div id="cards" class="cards"></div>
    </section>

    <footer>
      <div><h4>Phone Number</h4><p style="color:#bbb">+94 xx xxx xxxx</p></div>
      <div><h4>Name</h4><p style="color:#bbb">DScreations©</p></div>
    </footer>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-box">
      <h3>Supabase User Login</h3>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="field"><label>Email</label><input id="authEmail" type="email"></div>
        <div class="field"><label>Password</label><input id="authPassword" type="password"></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn red" onclick="login()">Login</button>
        <button class="btn" onclick="closeAuth()">Close</button>
      </div>
    </div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="modal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <h3>Student Details</h3>
        <button class="btn" onclick="closeDetails()">Close</button>
      </div>
      <div id="detailsContent"></div>
    </div>
  </div>

<script>
const supabase = window.supabase.createClient(
  "https://jjxsjggnzvzyupjhnxev.supabase.co",
  "YOUR_ANON_KEY_HERE"
);

let role = "guest";

function goHome(){ hidePanels(); document.getElementById("hero").classList.remove("hidden"); }
function hidePanels(){ ["addPanel","removePanel","explorePanel"].forEach(id=>document.getElementById(id).classList.add("hidden")); }
function openMode(mode){
  hidePanels();
  document.getElementById("hero").classList.add("hidden");
  if(mode==="add") document.getElementById("addPanel").classList.remove("hidden");
  if(mode==="remove") document.getElementById("removePanel").classList.remove("hidden");
  if(mode==="explore"){ document.getElementById("explorePanel").classList.remove("hidden"); loadCards(); }
}
function openAuth(){ document.getElementById("authModal").classList.add("show"); }
function closeAuth(){ document.getElementById("authModal").classList.remove("show"); }
function closeDetails(){ document.getElementById("detailsModal").classList.remove("show"); }
function toast(msg){ alert(msg); }

async function refreshAuth(){
  const { data:{user} } = await supabase.auth.getUser();
  if(!user){
    role="guest";
    document.getElementById("userRole").textContent = "Guest";
    document.getElementById("logoutBtn").classList.add("hidden");
    return;
  }
  const { data:profile } = await supabase.from("profiles").select("role").eq("id", user.id).single();
  role = profile?.role || "viewer";
  document.getElementById("userRole").textContent = role.toUpperCase();
  document.getElementById("logoutBtn").classList.remove("hidden");
}

async function login(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ toast("Incorrect login: " + error.message); return; }
  closeAuth();
  await refreshAuth();
  toast("Login successful");
}
async function logout(){
  await supabase.auth.signOut();
  await refreshAuth();
  toast("Logged out");
}
function requireAdmin(action){
  if(role !== "admin"){
    toast(action + " requires admin privileges.");
    openAuth();
    return false;
  }
  return true;
}

async function uploadFile(bucket, file, folder){
  if(!file) return null;
  const ext = (file.name.split(".").pop() || "bin").toLowerCase();
  const path = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await supabase.storage.from(bucket).upload(path, file);
  if(error) throw error;
  return path;
}
function publicPhoto(path){
  if(!path) return "";
  return supabase.storage.from("id-photos").getPublicUrl(path).data.publicUrl;
}

document.getElementById("addForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  if(!requireAdmin("Add Student")) return;
  if(!confirm("Confirm add student details?")) return;

  try{
    const { data:{user} } = await supabase.auth.getUser();
    const idPhotoFile = document.getElementById("id_photo").files[0];
    const birthFile = document.getElementById("birth_certificate").files[0];

    const id_photo_path = await uploadFile("id-photos", idPhotoFile, "students/id-photo");
    const birth_certificate_path = await uploadFile("birth-certificates", birthFile, "students/birth-cert");

    const payload = {
      first_name: val("first_name"),
      last_name: val("last_name"),
      gender: val("gender") || null,
      date_of_birth: document.getElementById("dob").value || null,
      age: val("age") ? Number(val("age")) : null,
      grade: val("grade"),
      class_name: val("class_name"),
      admission_number: val("admission_number") || null,
      phone: val("phone") || null,
      email: val("email") || null,
      status: val("status") || null,
      transport_method: val("transport_method") || null,

      address_line1: val("address_line1") || null,
      address_line2: val("address_line2") || null,
      address_line3: val("address_line3") || null,

      father_name: val("father_name") || null,
      father_id: val("father_id") || null,
      father_phone: val("father_phone") || null,
      father_profession: val("father_profession") || null,
      father_official_address: val("father_official_address") || null,
      father_office_phone: val("father_office_phone") || null,

      mother_name: val("mother_name") || null,
      mother_id: val("mother_id") || null,
      mother_phone: val("mother_phone") || null,
      mother_profession: val("mother_profession") || null,
      mother_official_address: val("mother_official_address") || null,
      mother_office_phone: val("mother_office_phone") || null,

      id_photo_path,
      birth_certificate_path,
      created_by: user?.id || null
    };

    const { error } = await supabase.from("students").insert([payload]);
    if(error){ toast("Insert failed: " + error.message); return; }
    toast("Student added successfully ✅");
    e.target.reset();
    openMode("explore");
  }catch(err){
    toast("Error: " + err.message);
  }
});

function val(id){ return document.getElementById(id)?.value.trim() || ""; }

async function removeById(){
  if(!requireAdmin("Remove Student")) return;
  const id = Number(document.getElementById("remove_id").value);
  if(!id){ toast("Enter valid student ID"); return; }
  if(!confirm("Are you sure you want to remove this student?")) return;

  const { error } = await supabase.from("students").delete().eq("student_id", id);
  if(error){ toast("Delete failed: " + error.message); return; }
  toast("Student removed ✅");
  document.getElementById("remove_id").value = "";
  loadCards();
}

async function loadCards(){
  const q = document.getElementById("search").value.trim();
  let query = supabase.from("students")
    .select("student_id,first_name,last_name,grade,class_name,phone,transport_method,id_photo_path")
    .order("student_id", { ascending:false });

  if(q){
    query = query.or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%,phone.ilike.%${q}%,class_name.ilike.%${q}%`);
  }

  const { data, error } = await query;
  const box = document.getElementById("cards");
  box.innerHTML = "";
  if(error){ box.innerHTML = "<p style='color:#fca5a5'>Load failed: "+error.message+"</p>"; return; }
  if(!data?.length){ box.innerHTML = "<p style='color:#bbb'>No records found.</p>"; return; }

  data.forEach(s=>{
    const card = document.createElement("div");
    card.className = "student-card";
    card.onclick = ()=> openDetails(s.student_id);
    const photo = s.id_photo_path ? `<img src="${publicPhoto(s.id_photo_path)}" alt="ID Photo">` : `<span style="color:#777">No ID Photo</span>`;
    card.innerHTML = `
      <div class="photo">${photo}</div>
      <h4>${escapeHtml(s.first_name || "")} ${escapeHtml(s.last_name || "")}</h4>
      <p>${escapeHtml(s.grade || "")} + ${escapeHtml(s.class_name || "")}</p>
      <small>${escapeHtml(s.phone || "")}</small>
    `;
    box.appendChild(card);
  });
}

async function openDetails(studentId){
  const { data, error } = await supabase.from("students").select("*").eq("student_id", studentId).single();
  if(error){ toast("Details restricted. Login to view more."); return; }

  const c = document.getElementById("detailsContent");
  const photo = data.id_photo_path ? `<img src="${publicPhoto(data.id_photo_path)}" style="width:150px;height:170px;object-fit:cover;border-radius:10px;border:1px solid #333">` : "No photo";
  const birthBtn = data.birth_certificate_path
    ? `<button class="btn" onclick="downloadBirthCert('${data.birth_certificate_path.replaceAll("'", "")}')">Download Birth Certificate</button>`
    : `<span style="color:#aaa">No birth certificate uploaded</span>`;

  c.innerHTML = `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px">${photo}</div>
    <div class="detail-grid">
      ${kv("Name", (data.first_name||"")+" "+(data.last_name||""))}
      ${kv("Grade + Class", (data.grade||"")+" + "+(data.class_name||""))}
      ${kv("Phone", data.phone||"-")}
      ${kv("Transport", data.transport_method||"-")}
      ${kv("Address", [data.address_line1,data.address_line2,data.address_line3].filter(Boolean).join(", ") || "-")}
      ${kv("Status", data.status||"-")}
      ${kv("Father", `${data.father_name||"-"} | ID: ${data.father_id||"-"} | ${data.father_phone||"-"} | ${data.father_profession||"-"} | ${data.father_official_address||"-"} | ${data.father_office_phone||"-"}`)}
      ${kv("Mother", `${data.mother_name||"-"} | ID: ${data.mother_id||"-"} | ${data.mother_phone||"-"} | ${data.mother_profession||"-"} | ${data.mother_official_address||"-"} | ${data.mother_office_phone||"-"}`)}
    </div>
    <div style="margin-top:12px">${birthBtn}</div>
    ${role==="admin" ? `<div style="margin-top:10px"><button class="btn red" onclick="removeFromModal(${data.student_id})">Delete This Student</button></div>` : ""}
  `;
  document.getElementById("detailsModal").classList.add("show");
}
function kv(k,v){ return `<div class="kv"><strong>${escapeHtml(k)}</strong><div style="margin-top:4px;color:#ddd">${escapeHtml(v)}</div></div>`; }
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m])); }

async function downloadBirthCert(path){
  const { data, error } = await supabase.storage.from("birth-certificates").createSignedUrl(path, 60);
  if(error){ toast("Download failed: " + error.message); return; }
  window.open(data.signedUrl, "_blank");
}
async function removeFromModal(id){
  closeDetails();
  document.getElementById("remove_id").value = id;
  openMode("remove");
}

supabase.auth.onAuthStateChange(async ()=>{ await refreshAuth(); });
refreshAuth();
goHome();
</script>
</body>
</html>
